appId: com.moufang.heshuidaqia
productName: 喝水打卡
copyright: Copyright © 2026 mou-fang
asar: true
extraResources:
  - from: assets/icon.ico
    to: icon.ico
directories:
  output: out/windows
files:
  - index.html
  - app.js
  - src/styles.css
  - dist/**/*
  - assets/icon.ico
  - electron/**/*
  - package.json
win:
  target: nsis
  icon: assets/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # 关闭窗口时后台托盘仍运行；退出应用请使用托盘右键菜单。

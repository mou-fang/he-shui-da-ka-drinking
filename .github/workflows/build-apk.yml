# 喝水打卡 Android APK 云端打包
#
# 为什么用 GitHub Actions 打 APK：
# 本机沙箱禁 Java 进程的 TCP 回环，Gradle 连不上自己的 daemon，
# 本地 ./gradlew assembleDebug 会报 "The first result from the daemon
# was empty"。GitHub 的 runner 没有这个限制，所以 APK 在这里打。
#
# 注意：不要用 android-actions/setup-android，它会让 sdkmanager 去装
# 已经下架的旧 'tools' 包，2026-11-19 第 1 次运行就是这样 17 秒就
# 失败的（Failed to find package 'tools'）。所以这里手动下载
# cmdline-tools，再用 sdkmanager 只装 platforms;android-36、
# build-tools;36.0.0 和 platform-tools。
#
# 触发方式：
# - 推到 main 分支就自动打一次，并把 APK 更新到 Release v1.0.0 里
# - 也可以在仓库 Actions 页面点 Run workflow 手动打
# - 推 v* 标签（如 v1.1.0）会以该标签名发一个新 Release
name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.14.3"

      # 手动装 Android SDK：先下 cmdline-tools（12.0），再用 sdkmanager
      # 装编译要用的平台和工具。ANDROID_HOME 写进 GITHUB_ENV，后面
      # Gradle 打包那步也能读到。
      - name: Install Android SDK
        run: |
          set -e
          SDK_DIR="$HOME/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_DIR/cmdline-tools"
          mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_HOME="$SDK_DIR"
          export PATH="$SDK_DIR/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # 注意：三个包必须一次装完。分开装的话，npm 会把前面
      # --no-save 装的包当成多余依赖删掉，npx cap 会找不到命令。
      - name: Install Capacitor
        run: npm install --no-save @capacitor/core@8.6.2 @capacitor/cli@8.6.2 @capacitor/android@8.6.2

      - name: Build web app
        run: npm run build

      # android/ 目录由 cap add 现场生成，仓库里只有 android/README.md
      # 一份说明，不提交原生工程（见 android/README.md）。
      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: he-shui-da-qia-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 推 main / 手动触发时发到 v1.0.0；推 v* 标签时发到该标签。
      - name: Publish APK to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="${GITHUB_REF_NAME}"; fi
          APK_NAME="he-shui-da-qia-${TAG}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          ls -lh "$APK_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --clobber
          else
            gh release create "$TAG" "$APK_NAME" \
              --title "$TAG" \
              --notes "喝水打卡 ${TAG} Android 版（debug APK，未签名，仅供自用安装测试）。安装方法：下载 ${APK_NAME} 到安卓手机直接安装；首次安装需允许“安装未知应用”。"
          fi
          gh release view "$TAG" --json tagName,assets --jq '{tag: .tagName, assets: [.assets[].name]}'

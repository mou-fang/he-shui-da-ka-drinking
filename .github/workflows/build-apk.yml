name: Build Android APK
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.14.3"
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK_DIR="$HOME/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_DIR/cmdline-tools"
          mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          export ANDROID_HOME="$SDK_DIR"
          export PATH="$SDK_DIR/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Static check and unit tests
        run: |
          npm run check
          npm test
      - name: Build shared web bundle
        run: npm run build
      - name: Generate Android project with Local Notifications
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
      - name: Apply app version to Android Gradle
        run: node scripts/sync-android-version.mjs
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: drinking-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # PR 也编译未签名 Release，用于验证正式打包链路，不公开分发这个包。
      - name: Verify unsigned release packaging
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Verify unsigned release output exists
        run: test -f android/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Sign Android release if keys are configured
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASS" || -z "$KEY_ALIAS" || -z "$KEY_PASS" ]]; then
            echo "::warning::未配置 Android 签名 Secrets，不发布无法可靠覆盖安装的 debug APK"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          (cd android && gradle assembleRelease --no-daemon --stacktrace)
          INPUT="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          OUTPUT="he-shui-da-ka-$GITHUB_REF_NAME-android-signed.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 "$INPUT" "$OUTPUT"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASS --key-pass env:KEY_PASS "$OUTPUT"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$OUTPUT"
          echo "SIGNED_APK=$OUTPUT" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Publish signed APK on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$SIGNED_APK" ]]; then exit 0; fi
          TAG="$GITHUB_REF_NAME"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes || gh release view "$TAG"
          gh release upload "$TAG" "$SIGNED_APK" --clobber
